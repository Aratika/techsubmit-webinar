<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechSummit admin</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background: #f5f5f4; color: #1c1c1a; margin: 0; padding: 24px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-top: 14px; }
  .hint { font-size: 12px; color: #666; margin: 2px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #bbb; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #185fa5; color: #fff; font-size: 14px; cursor: pointer; margin: 8px 8px 0 0; }
  button.alt { background: #0f6e56; }
  button.warn { background: #854f0b; }
  button:disabled { opacity: .5; cursor: wait; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: #f1efe8; border-radius: 8px; padding: 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: #555; }
  #msg { margin: 10px 0 0; font-size: 14px; }
  .ok { color: #0f6e56; } .err { color: #a32d2d; }
  pre { background: #f1efe8; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TechSummit admin</h1>

  <div class="card" id="login">
    <h2>Login</h2>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div id="loginMsg" class="err"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>Registrations</h2>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h2>Webinar settings</h2>
      <div id="fields"></div>
      <button id="saveBtn">Save settings</button>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>Send messages</h2>
      <div class="hint">Each button sends only to verified people who have not received that message yet.</div>
      <button class="alt" data-action="reminder-day">Send 1-day reminder</button>
      <button class="alt" data-action="reminder-hour">Send 1-hour reminder</button>
      <button class="warn" data-action="post-webinar">Send certificate and resources</button>
      <button data-action="analyze">Analyze data with AI</button>
      <pre id="out" class="hidden"></pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let pw = sessionStorage.getItem('adminPw') || '';

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-password': pw },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Error ' + res.status);
    err.status = res.status;
    throw err;
  }
  return data;
}

function showMsg(text, ok) {
  const m = $('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
}

function renderFields(settings) {
  const box = $('fields');
  box.textContent = '';
  for (const s of settings) {
    const label = document.createElement('label');
    label.textContent = s.label;
    label.htmlFor = 'f_' + s.key;
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = s.hint || '';
    const input = document.createElement('input');
    input.id = 'f_' + s.key;
    input.dataset.key = s.key;
    input.value = s.value || '';
    input.placeholder = s.type === 'url' ? 'https://...' : '';
    box.append(label, hint, input);
  }
}

function renderStats(st) {
  const items = [
    ['Registered', st.registered],
    ['Verified', st.verified],
    ['Waiting 1-day reminder', st.waitingDayReminder],
    ['Waiting 1-hour reminder', st.waitingHourReminder],
    ['Waiting post-webinar', st.waitingPostMessage],
  ];
  const box = $('stats');
  box.textContent = '';
  for (const [name, val] of items) {
    const d = document.createElement('div');
    d.className = 'stat';
    const b = document.createElement('b');
    b.textContent = val;
    const sp = document.createElement('span');
    sp.textContent = name;
    d.append(b, sp);
    box.append(d);
  }
}

async function loadPanel() {
  const [s, st] = await Promise.all([api('/settings'), api('/stats')]);
  renderFields(s.settings);
  renderStats(st);
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
}

async function login() {
  pw = $('pw').value || pw;
  $('loginMsg').textContent = '';
  try {
    await loadPanel();
    sessionStorage.setItem('adminPw', pw);
  } catch (e) {
    $('loginMsg').textContent = e.status === 401 ? 'Wrong password' : e.message;
  }
}

$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

$('saveBtn').onclick = async () => {
  const body = {};
  document.querySelectorAll('#fields input').forEach((i) => { body[i.dataset.key] = i.value; });
  $('saveBtn').disabled = true;
  try {
    const r = await api('/settings', { method: 'PUT', body: JSON.stringify(body) });
    renderFields(r.settings);
    showMsg('Saved. New emails and messages use these values from now on.', true);
  } catch (e) {
    showMsg(e.message, false);
  } finally {
    $('saveBtn').disabled = false;
  }
};

document.querySelectorAll('[data-action]').forEach((btn) => {
  btn.onclick = async () => {
    const action = btn.dataset.action;
    const st = await api('/stats').catch(() => null);
    const pending = st && {
      'reminder-day': st.waitingDayReminder,
      'reminder-hour': st.waitingHourReminder,
      'post-webinar': st.waitingPostMessage,
    }[action];
    if (pending !== undefined && pending !== null) {
      if (!confirm('This will send WhatsApp messages to ' + pending + ' people. Continue?')) return;
    }
    btn.disabled = true;
    const out = $('out');
    out.classList.remove('hidden');
    out.textContent = 'Working...';
    try {
      const r = await api('/actions/' + action, { method: 'POST', body: '{}' });
      out.textContent = r.insights
        ? 'Stats:\n' + JSON.stringify(r.stats, null, 2) + '\n\nInsights:\n' + r.insights
        : 'Done. Total: ' + r.total + ', sent: ' + r.sent + ', failed: ' + r.failed;
      renderStats(await api('/stats'));
    } catch (e) {
      out.textContent = 'Failed: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  };
});

if (pw) { $('pw').value = pw; login(); }
</script>
</body>
</html>
